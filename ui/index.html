<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Xero Invoice Card</title>
    <style>
      /* Brand tokens. Defaults are deliberately neutral (system fonts, no
         vendor identity, no external fetches); an MCP server (or the
         gateway) can override them per-tenant by injecting window.__BRAND__
         — see the brand-inject marker comment below and invoice-card.ts. */
      :root {
        --brand-primary: #2563eb; /* headings, links, status accent */
        --brand-accent: #e5e7eb;  /* fills / CTA */
        --brand-bg: #ffffff;
        --brand-text: #1f2937;
        --brand-muted: #6b7280;
        --brand-line: #e5e7eb;
        --brand-font-heading: system-ui, -apple-system, "Segoe UI", sans-serif;
        --brand-font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
        --brand-radius: 6px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--brand-bg);
        color: var(--brand-text);
        font-family: var(--brand-font-body);
        font-size: 15px;
        line-height: 1.5;
        padding: 16px;
      }
      .card {
        max-width: 560px;
        border: 1px solid var(--brand-line);
        border-radius: var(--brand-radius);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        overflow: hidden;
      }
      .card__bar { height: 4px; background: var(--brand-primary); }
      .card__body { padding: 20px 24px 24px; }
      .brandrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .brandid { display: flex; align-items: center; gap: 8px; }
      .brandid img { height: 18px; width: auto; display: none; }
      .brand {
        font-family: var(--brand-font-heading);
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--brand-text);
        font-size: 15px;
      }
      .invoiceno {
        font-family: var(--brand-font-heading);
        color: var(--brand-muted);
        font-size: 14px;
        letter-spacing: 0.04em;
      }
      h1 {
        font-family: var(--brand-font-heading);
        color: var(--brand-primary);
        font-weight: 600;
        font-size: 21px;
        line-height: 1.15;
        margin: 0 0 16px;
      }
      .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
      .badge {
        font-family: var(--brand-font-heading);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 4px 10px;
        border-radius: var(--brand-radius);
        border: 1px solid var(--brand-line);
        color: var(--brand-text);
      }
      .badge--status { border-color: var(--brand-primary); color: var(--brand-primary); }
      .badge--type { background: var(--brand-accent); border-color: var(--brand-accent); }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 24px;
        margin-bottom: 18px;
      }
      .field__label {
        font-family: var(--brand-font-heading);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 11px;
        color: var(--brand-muted);
        margin-bottom: 2px;
      }
      .field__value { font-size: 14px; font-weight: 600; }
      .amounts {
        border-top: 1px solid var(--brand-line);
        padding-top: 12px;
        margin-bottom: 18px;
      }
      .amount {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        padding: 2px 0;
      }
      .amount__label { color: var(--brand-muted); }
      .amount--total {
        font-weight: 700;
        font-size: 15px;
        border-top: 1px solid var(--brand-line);
        margin-top: 6px;
        padding-top: 8px;
      }
      .amount--total .amount__label { color: var(--brand-text); }
      .amount--due { color: var(--brand-primary); font-weight: 700; }
      .amount--due .amount__label { color: var(--brand-primary); }
      .items { border-top: 1px solid var(--brand-line); padding-top: 14px; }
      .items__h {
        font-family: var(--brand-font-heading);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 11px;
        color: var(--brand-muted);
        margin-bottom: 8px;
      }
      .item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 14px;
        padding: 6px 10px;
        background: #fafafa;
        border-left: 2px solid var(--brand-primary);
        margin-bottom: 6px;
      }
      .item__desc { flex: 1; }
      .item__qty { color: var(--brand-muted); white-space: nowrap; }
      .item__amount { font-weight: 600; white-space: nowrap; }
      .items__more { color: var(--brand-muted); font-size: 13px; font-style: italic; }
      .loading { color: var(--brand-muted); font-style: italic; }
    </style>
    <!-- BRAND_INJECT: a server/gateway replaces this comment with
         <script>window.__BRAND__={name,logoUrl,primaryColor,accentColor,bg,text}</script>
         to theme the card per-tenant. No injection = neutral defaults above. -->
  </head>
  <body>
    <div id="root"><p class="loading">Loading invoice…</p></div>
    <script type="module" src="./invoice-card.ts"></script>
  </body>
</html>
